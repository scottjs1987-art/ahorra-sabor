name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Lint + TypeScript check
  # ──────────────────────────────────────────────────────────
  check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar tipos de Worker
        run: npx wrangler types
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: TypeScript check
        run: npx tsc --noEmit

  # ──────────────────────────────────────────────────────────
  # JOB 2: Deploy a Cloudflare Workers
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: worker

    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://ahorra-sabor-worker.tu-subdominio.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Deploy a Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          environment: ${{ github.event.inputs.environment || 'production' }}
          # Secrets inyectados desde GitHub Secrets → Cloudflare Worker secrets
          secrets: |
            SUPABASE_URL
            SUPABASE_SERVICE_KEY
            MP_ACCESS_TOKEN
            MP_WEBHOOK_SECRET
            QR_SIGNING_SECRET
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MP_ACCESS_TOKEN:      ${{ secrets.MP_ACCESS_TOKEN }}
          MP_WEBHOOK_SECRET:    ${{ secrets.MP_WEBHOOK_SECRET }}
          QR_SIGNING_SECRET:    ${{ secrets.QR_SIGNING_SECRET }}

      - name: Notificar deploy exitoso
        if: success()
        run: |
          echo "::notice title=Deploy OK::Worker desplegado en Cloudflare ✅"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Notificar deploy fallido
        if: failure()
        run: echo "::error title=Deploy fallido::Revisá los logs de Wrangler ⚠️"
